name: Release

# Wird ausgelöst durch einen Tag-Push der Form v1.2.3
# oder manuell über die GitHub-UI ("Run workflow")
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust Setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: NPM Install
        run: npm ci

      - name: Build & Release via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RunMMO ${{ github.ref_name }}"
          releaseBody: |
            ## RunMMO ${{ github.ref_name }}

            Siehe Commit-Historie für Details.

            ### Installation
            - **Windows**: `.exe` (NSIS-Installer) herunterladen
            - **macOS**: `.dmg` herunterladen

            ### Auto-Update
            Falls du eine bestehende Version nutzt: ESC → Tab „Update" → „Nach Updates suchen".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Schritt zum Generieren der `latest.json` als finalisierter Release-Asset
  # (tauri-action erzeugt latest.json automatisch, dieser Job veröffentlicht
  # das Release als nicht-Draft, sobald alle Plattformen gebaut haben).
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release publizieren
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) {
              core.setFailed(`Release ${tag} nicht gefunden`);
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
            });
            core.info(`Release ${tag} publiziert`);
